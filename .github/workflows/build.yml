name: Build Extrude (Theos)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project directory
        id: find-dir
        run: |
          if [ -f "Makefile" ]; then
            echo "WORK_DIR=." >> $GITHUB_ENV
          elif [ -f "extrude-ios27/Makefile" ]; then
            echo "WORK_DIR=extrude-ios27" >> $GITHUB_ENV
          else
            DIR=$(find . -name "Makefile" -not -path "*/.*" | head -n 1 | xargs dirname)
            echo "WORK_DIR=$DIR" >> $GITHUB_ENV
          fi
          echo "Found project directory: $WORK_DIR"
          ls -la

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Setup iOS SDK
        run: |
          curl -sL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o sdk.tar.xz
          mkdir -p theos/sdks
          tar -xf sdk.tar.xz -C theos/sdks
          rm sdk.tar.xz

      - name: Install dependencies & ldid
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot dpkg rsync perl curl cmake libplist-dev libssl-dev pkg-config
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          make -j$(nproc)
          sudo cp ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Setup Theos toolchain
        run: |
          curl -sL https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma -o toolchain.tar.lzma
          mkdir -p theos/toolchain/linux/iphone
          tar --lzma -xf toolchain.tar.lzma -C theos/toolchain/linux/iphone
          rm toolchain.tar.lzma

      - name: Build package
        run: |
          export THEOS=$(pwd)/theos
          export PATH="$THEOS/bin:$PATH"
          cd ${{ env.WORK_DIR }}
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 2>&1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: extrude-deb
          path: |
            packages/*.deb
            ${{ env.WORK_DIR }}/packages/*.deb
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            ${{ env.WORK_DIR }}/packages/*.deb
          generate_release_notes: true
