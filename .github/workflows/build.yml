name: Build Extrude (Theos)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project directory
        id: find-dir
        run: |
          if [ -f "Makefile" ]; then
            echo "WORK_DIR=." >> $GITHUB_ENV
          elif [ -f "extrude-ios27/Makefile" ]; then
            echo "WORK_DIR=extrude-ios27" >> $GITHUB_ENV
          else
            DIR=$(find . -name "Makefile" -not -path "*/.*" -not -path "./theos/*" | head -n 1 | xargs dirname)
            echo "WORK_DIR=$DIR" >> $GITHUB_ENV
          fi
          echo "Found project directory: $WORK_DIR"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Setup iOS SDK
        run: |
          curl -sL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o sdk.tar.xz
          mkdir -p theos/sdks
          tar -xf sdk.tar.xz -C theos/sdks
          rm sdk.tar.xz

      - name: Install dependencies, toolchain compatibility & ldid
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot dpkg rsync perl curl cmake libplist-dev libssl-dev pkg-config libxml2 libncurses6 libtinfo6
          
          # Solución de raíz para libtinfo.so.5 y libncurses.so.5 en Ubuntu moderno
          TINFO6=$(find /usr/lib -name "libtinfo.so.6*" 2>/dev/null | head -n 1)
          if [ -n "$TINFO6" ]; then
            sudo ln -sf "$TINFO6" /usr/lib/x86_64-linux-gnu/libtinfo.so.5
            sudo ln -sf "$TINFO6" /lib/x86_64-linux-gnu/libtinfo.so.5 || true
          fi
          
          NCURSES6=$(find /usr/lib -name "libncurses.so.6*" 2>/dev/null | head -n 1)
          if [ -n "$NCURSES6" ]; then
            sudo ln -sf "$NCURSES6" /usr/lib/x86_64-linux-gnu/libncurses.so.5
            sudo ln -sf "$NCURSES6" /lib/x86_64-linux-gnu/libncurses.so.5 || true
          fi
          
          sudo ldconfig

          # Compilar ldid
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          make -j$(nproc)
          sudo cp ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Setup Theos toolchain (LLVM/Clang for Linux)
        run: |
          mkdir -p theos/toolchain/linux/iphone
          curl -sL https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma -o toolchain.tar.lzma
          tar --strip-components=1 --lzma -xf toolchain.tar.lzma -C theos/toolchain/linux/iphone
          rm toolchain.tar.lzma
          chmod +x theos/toolchain/linux/iphone/bin/*
          
          # Verificar que clang ejecute sin error de librerías
          theos/toolchain/linux/iphone/bin/clang --version

      - name: Build package
        run: |
          export THEOS=$(pwd)/theos
          export PATH="$THEOS/bin:$PATH"
          cd ${{ env.WORK_DIR }}
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 2>&1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: extrude-deb
          path: |
            packages/*.deb
            ${{ env.WORK_DIR }}/packages/*.deb
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            ${{ env.WORK_DIR }}/packages/*.deb
          generate_release_notes: true
