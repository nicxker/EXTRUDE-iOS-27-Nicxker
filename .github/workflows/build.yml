name: Build Extrude (Theos)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13  # Apple Silicon runner (M1)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Setup Theos SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: theos/sdks
          sparse-checkout: |
            iPhoneOS16.5.sdk
          sparse-checkout-cone-mode: false

      - name: Setup environment
        run: |
          echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV
          echo "$(pwd)/theos/bin" >> $GITHUB_PATH

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg make

      - name: Build package
        run: |
          export THEOS=$(pwd)/theos
          export PATH="$THEOS/bin:$PATH"
          gmake package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 2>&1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: extrude-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true
